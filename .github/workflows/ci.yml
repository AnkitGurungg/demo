name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  backend-validation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: this-is-mine

    steps:
      - name: NICE
        uses: actions/checkout@v4

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Backend Tests
        run: ./mvnw clean verify