name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Backend Tests
        run: ./mvnw clean verify